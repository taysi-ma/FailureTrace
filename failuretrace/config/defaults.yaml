# FailureTrace configuration — Phase 1 keys. Later phases EXTEND (never replace) this file.
# In-tree paths are development defaults ONLY; override via Settings overrides or the
# FAILURETRACE_DATA_DIR environment variable. Never hard-code paths at call sites.

# --- Feature flags ---
enabled: true
# NOTE: spec §1.1 defaults ollama_enabled to false; this project deliberately ships it
# ON (local Ollama is the only permitted, and optional, LLM). It is strictly additive and
# transparently falls back to the deterministic path on any failure, and the LLM can never
# raise causal level, force a hard constraint, or overwrite rubric confidence. Trade-off:
# with Ollama installed, `ingest`/`record` really call localhost (add latency); an
# unreachable/ hung endpoint costs up to (max_retries+1) x timeout_seconds before fallback.
# Pass --no-ollama (or set false) for a fully deterministic/offline run.
ollama_enabled: true
collect_telemetry: true        # false -> trials are ingested without normalized telemetry
store_raw_json: true
counterfactual_planner_enabled: true   # auto-plan a counterfactual for plannable categories at ingestion
replication_gate_enabled: true         # allow `failuretrace gate` to persist replication promotions

# --- Paths (development defaults; overridable) ---
paths:
  data_dir: failuretrace/data          # db + trials/ live under here
  reports_dir: failuretrace/reports

# --- Metric configuration (direction-aware, central). Never assume larger is better. ---
metric:
  name: val_bpb
  direction: minimize   # or maximize

# --- Classifier thresholds (Phase 2). No magic numbers in code; all live here. ---
thresholds:
  gpu_memory_ratio_resource_pressure: 0.98
  gradient_norm_cv_instability: 2.0
  undertraining_loss_slope: -0.01
  overfitting_train_val_gap: 0.10
  inconclusive_noise_floor: 0.001
  replication_minimum_trials: 2
  counterfactual_minimum_support: 1
  c4_minimum_counterfactuals: 2  # C3->C4 needs >=2 confirmations from >=2 distinct contexts
  resource_vram_limit_gb: null   # objective hard-constraint limit; null = no limit (Phase 3)

# --- Confidence rubric (Phase 2). tier value x evidence completeness; see classifier docs. ---
confidence:
  deterministic: 0.95
  strong_heuristic: 0.7
  weak_heuristic: 0.5
  default: 0.3

# --- Local Ollama endpoint (Phase 3). Optional; only used when ollama_enabled. ---
ollama:
  base_url: http://localhost:11434
  model: llama3.1            # user-overridable
  timeout_seconds: 30
  max_retries: 1
  format: json               # request structured JSON output

# --- Retrieval scoring (Phase 4). Deterministic, explainable; weights live here. ---
retrieval:
  weights:
    category_match: 3.0
    component_match: 2.0
    hyperparameter_overlap: 1.5
    range_proximity: 1.0
    causal_support: 2.0
    recency: 0.5
    repeated_support: 1.5
    effect_magnitude: 2.0   # Phase 7: boosts failures with a measured controlled effect
  recency_half_life_days: 30
  log_scale_parameters: [lr, learning_rate, weight_decay]  # proximity in log-space
  # Minimum relevance for a prior failure to be returned at all. 0.0 keeps default behavior
  # (drops only exact-zero matches); raise it so weak / recency-only matches cannot pad
  # top-k and inflate downstream guidance counts.
  min_relevance_score: 0.0

# --- Pre-experiment brief (Phase 8). The retrieval half of the loop, delivered to the
# agent BEFORE it commits an edit. Bounded on purpose: long contexts are used poorly in
# the middle (Liu et al., TACL 2024), so only the top-ranked evidence is injected and the
# remainder is reported as a count rather than dumped.
brief:
  max_items: 5      # per section (hard constraints / soft penalties / plausible context)
  max_chars: 2000   # hard ceiling on the rendered brief; overflow is truncated + counted

# --- Changed-tunable -> component mapping (Phase 8) ---------------------------------
# `brief --infer-from` recovers which train.py constants an agent changed, but retrieval
# also scores component overlap. This maps the real autoresearch knobs (train.py:432-451)
# onto the coarse components stored on trials. Written component -> knobs for readability;
# the lookup is inverted in code. Unmapped knobs simply contribute no component signal.
#
# NOTE: deliberately NOT part of Settings._SEMANTIC_SECTIONS. This mapping and `brief`
# above shape retrieval *queries*, not the meaning of a persisted record, and adding a
# section to the semantic hash would change the settings_hash of every record already
# written.
components:
  optimizer: [EMBEDDING_LR, UNEMBEDDING_LR, MATRIX_LR, SCALAR_LR, WEIGHT_DECAY, ADAM_BETAS]
  schedule: [WARMUP_RATIO, WARMDOWN_RATIO, FINAL_LR_FRAC]
  model: [ASPECT_RATIO, HEAD_DIM, WINDOW_PATTERN, DEPTH]
  batch: [TOTAL_BATCH_SIZE, DEVICE_BATCH_SIZE]

# --- Counterfactual success criterion (Phase 9) --------------------------------------
# What it means for a C2->C3 counterfactual to CONFIRM its plan, per failure category.
#
#   metric_improvement  the counterfactual trial must show a direction-aware improvement
#                       above `inconclusive_noise_floor` versus the baseline. Correct
#                       whenever the hypothesis is about the metric.
#   completion          the counterfactual trial must simply have RUN TO COMPLETION.
#
# `resource_pressure` uses `completion` because its hypothesis is "this configuration does
# not fit in memory". The planned intervention (interventions.py:71-80) is "decrease
# DEVICE_BATCH_SIZE, raise gradient accumulation, hold the effective batch constant" — and
# the prediction that intervention makes is *the run stops OOMing*, not *val_bpb improves*.
# Reducing a batch carries no reason to improve the metric, so judging it on the metric
# tested a claim the hypothesis never made: real T4 evidence reached C2 and then stalled on
# a counterfactual that had in fact confirmed exactly what was predicted.
#
# This is NOT a weaker bar. A completion-judged promotion still requires a persisted plan,
# an effective level of exactly C2, and `counterfactual_minimum_support` linked trials that
# each ran to completion. Categories absent from the map fall back to `default`.
counterfactual:
  success_criterion:
    default: metric_improvement
    resource_pressure: completion

# --- Controlled effect-size estimation (Phase 7). Deterministic; no priors/sampling. ---
# Summarizes the magnitude + a closed-form interval of a hypothesis's counterfactual
# (controlled) trials once it reaches C3. Purely additive: with enabled=false nothing
# is estimated and retrieval/guidance/reports are byte-for-byte unchanged.
estimation:
  enabled: true
  confidence_level: 0.90               # must be one of the z_by_level keys below
  min_counterfactuals_for_interval: 2  # an interval needs >= this many replicates
  small_sample_widening: 1.0           # >=1.0 multiplier on the standard error (small-k caution)
  z_by_level:                          # standard-normal quantiles (no scipy dependency)
    "0.80": 1.2816
    "0.90": 1.6449
    "0.95": 1.9600
    "0.99": 2.5758
