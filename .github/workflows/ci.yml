name: ci

# Provider-free, CPU-only, offline test suite. No GPU, no Ollama, no network services
# are required — every test runs deterministically on a stock runner.
#
# One Python version, one locked dependency set: the development venv. `.python-version`
# and `requirements-ci.txt` are the single source of truth for both, so a green run means
# the code works in the environment it is actually developed in. Testing a matrix of
# interpreters against whatever pip resolved that morning tested neither.
#
# Action majors must stay on a supported Node runtime. checkout@v4 / setup-python@v5
# declare node20, which reached end-of-life in April 2026; keep these on the current
# major (node24) rather than letting them rot.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python (from .python-version)
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install the locked environment
        # The lock is installed first and the package with --no-deps, so pip never
        # re-resolves a pinned version away.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps
      - name: Check the lock still satisfies pyproject
        # Fails if a dependency was added to pyproject.toml without being added to
        # requirements-ci.txt, which --no-deps would otherwise hide.
        run: python -m pip check
      - name: Run test suite (CPU-only, offline)
        run: python -m pytest -q

  packaging-smoke:
    # Deliberately NOT locked: this job is the "does a fresh install still work" guard, so
    # it resolves pyproject's ranges the way a new user would. It also checks the package
    # is usable from any working directory — the "No module named failuretrace" trap of
    # running it uninstalled outside the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install core only (minimal, provider-free)
        run: python -m pip install -e .
      - name: Run the CLI from a different directory
        run: |
          cd "$RUNNER_TEMP"
          failuretrace --data-dir ./ftdata --reports-dir ./ftreports init
          python -m failuretrace --data-dir ./ftdata2 --reports-dir ./ftreports2 demo
